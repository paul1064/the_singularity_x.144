name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK (inkl. Plattform 35 / Build-Tools) ist auf ubuntu-latest vorinstalliert.
      - name: SDK-Lizenzen akzeptieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-Spiel in Android-Projekt synchronisieren
        run: npx cap sync android

      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/the-singularity-x144.apk

      - uses: actions/upload-artifact@v4
        with:
          name: the-singularity-x144-apk
          path: out/the-singularity-x144.apk
          if-no-files-found: error
